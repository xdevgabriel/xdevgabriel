<!-- AUTOMATION -->
<g class="float" style="animation-delay:2.4s">
<rect class="card" x="815" y="610" width="350" height="205" rx="13"/>

<text x="1140" y="645" text-anchor="end" class="meta">09 / 12</text>
<text x="838" y="708" class="label">AUTOMATION</text>
<text x="838" y="735" class="title">Workflow Infrastructure</text>
<text x="838" y="759" class="desc">Business automation, integrations</text>
<text x="838" y="776" class="desc">and event-based workflows.</text>
<text x="838" y="802" class="tech">n8n · Webhooks · APIs</text>
<circle cx="1090" cy="755" r="62" fill="url(#dots)" opacity=".28"/>
</g>

<!-- ROW 4 -->

<!-- DOCKER / LINUX -->
<g class="float" style="animation-delay:2.7s">
<rect class="card" x="35" y="835" width="350" height="205" rx="13"/>

<text x="360" y="870" text-anchor="end" class="meta">10 / 12</text>
<text x="58" y="933" class="label" fill="#67E8F9">CONTAINERS</text>
<text x="58" y="960" class="title">Docker &amp; Linux</text>
<text x="58" y="984" class="desc">Containerized deployments and</text>
<text x="58" y="1001" class="desc">Linux-based infrastructure.</text>
<text x="58" y="1027" class="tech">Docker · Linux · Compose</text>
<path d="M270 1040 C310 985 340 1010 390 950" class="line" stroke="#22D3EE"/>
</g>

<!-- NGINX / CLOUD -->
<g class="float" style="animation-delay:3s">
<rect class="card" x="425" y="835" width="350" height="205" rx="13"/>

<text x="750" y="870" text-anchor="end" class="meta">11 / 12</text>
<text x="448" y="933" class="label" fill="#60A5FA">INFRASTRUCTURE</text>
<text x="448" y="960" class="title">Cloud &amp; Reverse Proxy</text>
<text x="448" y="984" class="desc">Deployments, networking and</text>
<text x="448" y="1001" class="desc">production infrastructure.</text>
<text x="448" y="1027" class="tech">Nginx · GCP · Cloud</text>
<path d="M625 1040 C655 995 685 1015 740 950" class="line" stroke="#60A5FA"/>
</g>

<!-- GIT / GITHUB -->
<g class="float" style="animation-delay:3.3s">
<rect class="card" x="815" y="835" width="350" height="205" rx="13"/>

<text x="1140" y="870" text-anchor="end" class="meta">12 / 12</text>
<text x="838" y="933" class="label" fill="#FDBA74">DEVELOPMENT</text>
<text x="838" y="960" class="title">Version Control</text>
<text x="838" y="984" class="desc">Collaboration, source control</text>
<text x="838" y="1001" class="desc">and engineering workflow.</text>
<text x="838" y="1027" class="tech">Git · GitHub · CI/CD</text>
<path d="M1050 1040 L1090 995 L1120 1015 L1170 955" class="line" stroke="#FB923C"/>
