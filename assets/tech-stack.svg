<!-- FOOTER -->
<line x1="320" y1="1100" x2="485" y2="1100" stroke="#1F8F58"/>
<line x1="715" y1="1100" x2="880" y2="1100" stroke="#1F8F58"/>

<text x="600" y="1106" text-anchor="middle"
